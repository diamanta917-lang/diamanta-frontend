<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <filter id="sombra">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="#f8f9fa" rx="8"/>

  <!-- Título -->
  <rect x="0" y="0" width="900" height="40" fill="#0d6efd" rx="8"/>
  <rect x="0" y="20" width="900" height="20" fill="#0d6efd"/>
  <text x="450" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">DIAMANTA — Flujo de Información</text>

  <!-- =============== CAPA USUARIO =============== -->
  <text x="30" y="68" fill="#0d6efd" font-size="11" font-weight="bold">USUARIO</text>

  <rect x="30" y="80" width="200" height="45" fill="white" stroke="#0d6efd" rx="8" filter="url(#sombra)"/>
  <text x="130" y="100" text-anchor="middle" fill="#0d6efd" font-size="11" font-weight="bold">🔐 Login</text>
  <text x="130" y="115" text-anchor="middle" fill="#666" font-size="9">Email / Password</text>

  <rect x="250" y="80" width="200" height="45" fill="white" stroke="#0d6efd" rx="8" filter="url(#sombra)"/>
  <text x="350" y="100" text-anchor="middle" fill="#0d6efd" font-size="11" font-weight="bold">📷 Escáner Código Barras</text>
  <text x="350" y="115" text-anchor="middle" fill="#666" font-size="9">USB / useBarcodeScanner</text>

  <rect x="470" y="80" width="200" height="45" fill="white" stroke="#0d6efd" rx="8" filter="url(#sombra)"/>
  <text x="570" y="100" text-anchor="middle" fill="#0d6efd" font-size="11" font-weight="bold">📄 Archivos Excel</text>
  <text x="570" y="115" text-anchor="middle" fill="#666" font-size="9">.xlsx / .xls</text>

  <!-- Flechas USUARIO -> FRONTEND -->
  <path d="M 130,125 L 130,165" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350,125 L 350,165" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 570,125 L 570,165" stroke="#0d6efd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =============== CAPA FRONTEND =============== -->
  <rect x="20" y="165" width="860" height="90" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5" rx="6"/>
  <text x="30" y="185" fill="#1565c0" font-size="11" font-weight="bold">FRONTEND (React + Vite)</text>

  <rect x="30" y="195" width="130" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="95" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Dashboard</text>
  <text x="95" y="232" text-anchor="middle" fill="#666" font-size="8">Métricas</text>

  <rect x="175" y="195" width="130" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="240" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Asignar</text>
  <text x="240" y="232" text-anchor="middle" fill="#666" font-size="8">Escaneo + Asignación</text>

  <rect x="320" y="195" width="130" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="385" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Control Calidad</text>
  <text x="385" y="232" text-anchor="middle" fill="#666" font-size="8">Aprobar / Rechazar</text>

  <rect x="465" y="195" width="130" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="530" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Importar Excel</text>
  <text x="530" y="232" text-anchor="middle" fill="#666" font-size="8">Carga masiva</text>

  <rect x="610" y="195" width="130" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="675" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Prendas</text>
  <text x="675" y="232" text-anchor="middle" fill="#666" font-size="8">Listado / Filtros</text>

  <rect x="755" y="195" width="110" height="45" fill="white" stroke="#0d6efd" rx="6" filter="url(#sombra)"/>
  <text x="810" y="218" text-anchor="middle" fill="#0d6efd" font-size="10" font-weight="bold">Reportes</text>
  <text x="810" y="232" text-anchor="middle" fill="#666" font-size="8">Excel / PDF</text>

  <!-- Flecha FRONTEND -> SERVICIOS -->
  <path d="M 450,255 L 450,295" stroke="#fd7e14" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =============== CAPA SERVICIOS =============== -->
  <rect x="20" y="295" width="860" height="70" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5" rx="6"/>
  <text x="30" y="315" fill="#e65100" font-size="11" font-weight="bold">SERVICIOS (Supabase Client)</text>

  <rect x="30" y="325" width="200" height="30" fill="white" stroke="#fd7e14" rx="6" filter="url(#sombra)"/>
  <text x="130" y="345" text-anchor="middle" fill="#e65100" font-size="9">garmentsService | movementsService | auditService</text>

  <rect x="250" y="325" width="200" height="30" fill="white" stroke="#fd7e14" rx="6" filter="url(#sombra)"/>
  <text x="350" y="345" text-anchor="middle" fill="#e65100" font-size="9">reportsService | operariasService | areasService</text>

  <rect x="470" y="325" width="200" height="30" fill="white" stroke="#fd7e14" rx="6" filter="url(#sombra)"/>
  <text x="570" y="345" text-anchor="middle" fill="#e65100" font-size="9">returnReasonsService | statusesService</text>

  <!-- Flecha SERVICIOS -> SUPABASE -->
  <path d="M 250,355 L 250,395" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450,355 L 450,395" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 650,355 L 650,395" stroke="#28a745" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- =============== CAPA SUPABASE =============== -->
  <rect x="20" y="395" width="860" height="120" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5" rx="6"/>
  <text x="30" y="415" fill="#2e7d32" font-size="11" font-weight="bold">BACKEND (Supabase / PostgreSQL)</text>

  <rect x="30" y="425" width="195" height="45" fill="white" stroke="#28a745" rx="6" filter="url(#sombra)"/>
  <text x="127" y="445" text-anchor="middle" fill="#28a745" font-size="10" font-weight="bold">Supabase Auth</text>
  <text x="127" y="460" text-anchor="middle" fill="#666" font-size="8">Autenticación</text>

  <rect x="245" y="425" width="195" height="45" fill="white" stroke="#28a745" rx="6" filter="url(#sombra)"/>
  <text x="342" y="445" text-anchor="middle" fill="#28a745" font-size="10" font-weight="bold">PostgreSQL</text>
  <text x="342" y="460" text-anchor="middle" fill="#666" font-size="8">BD + RLS + Triggers</text>

  <rect x="460" y="425" width="195" height="45" fill="white" stroke="#28a745" rx="6" filter="url(#sombra)"/>
  <text x="557" y="445" text-anchor="middle" fill="#28a745" font-size="10" font-weight="bold">RPC Functions</text>
  <text x="557" y="460" text-anchor="middle" fill="#666" font-size="8">search / dashboard</text>

  <rect x="675" y="425" width="195" height="45" fill="white" stroke="#28a745" rx="6" filter="url(#sombra)"/>
  <text x="772" y="445" text-anchor="middle" fill="#28a745" font-size="10" font-weight="bold">Realtime</text>
  <text x="772" y="460" text-anchor="middle" fill="#666" font-size="8">Actualización en vivo</text>

  <!-- Flecha Realtime directo a Dashboard -->
  <path d="M 675,470 L 675,480 L 95,480 L 95,240" stroke="#dc3545" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="350" y="475" fill="#dc3545" font-size="8">Realtime: cambios en garments/movements</text>

  <!-- =============== LEYENDA =============== -->
  <rect x="20" y="530" width="860" height="75" fill="white" stroke="#dee2e6" rx="8"/>
  <text x="30" y="550" fill="#333" font-size="12" font-weight="bold">Ciclo de Vida de una Prenda</text>

  <rect x="30" y="560" width="110" height="30" fill="#fff3cd" stroke="#ffc107" rx="15"/>
  <text x="85" y="580" text-anchor="middle" fill="#856404" font-size="9" font-weight="bold">Pendiente</text>

  <path d="M 140,575 L 160,575" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="165" y="560" width="110" height="30" fill="#cce5ff" stroke="#0d6efd" rx="15"/>
  <text x="220" y="580" text-anchor="middle" fill="#004085" font-size="9" font-weight="bold">En Producción</text>

  <path d="M 275,575 L 295,575" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="560" width="110" height="30" fill="#e2e3f5" stroke="#6f42c1" rx="15"/>
  <text x="355" y="580" text-anchor="middle" fill="#383d41" font-size="9" font-weight="bold">Control Calidad</text>

  <path d="M 410,575 L 430,575" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="445" y="555" width="100" height="40" fill="#d4edda" stroke="#28a745" rx="15"/>
  <text x="495" y="572" text-anchor="middle" fill="#155724" font-size="8" font-weight="bold">Almacén</text>
  <text x="495" y="584" text-anchor="middle" fill="#155724" font-size="7">(Aprobada)</text>

  <rect x="560" y="555" width="100" height="40" fill="#d4edda" stroke="#28a745" rx="15"/>
  <text x="610" y="572" text-anchor="middle" fill="#155724" font-size="8" font-weight="bold">Despachada</text>
  <text x="610" y="584" text-anchor="middle" fill="#155724" font-size="7">(Aprobada)</text>

  <rect x="690" y="560" width="110" height="30" fill="#f8d7da" stroke="#dc3545" rx="15"/>
  <text x="745" y="580" text-anchor="middle" fill="#721c24" font-size="9" font-weight="bold">Devuelta</text>

  <path d="M 355,590 L 355,598 L 495,598" stroke="#28a745" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 355,590 L 355,598 L 610,598" stroke="#28a745" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <path d="M 355,590 L 355,600 L 745,600" stroke="#dc3545" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
</svg>
